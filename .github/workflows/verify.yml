name: Verify public PR fixture
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test
        run: python -m unittest discover -s tests -v
      - name: Check for forbidden private material
        run: python scripts/check_public_scope.py
