name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check ruff bandit
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: ruff check scripts tests
      - name: Bandit medium/high findings
        run: bandit -q -r scripts tests -ll
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public scope policy
        run: python scripts/check_public_scope.py
      - name: YAML syntax
        run: |
          python -m pip install --disable-pip-version-check yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' .github/workflows
      - name: ShellCheck (when shell files exist)
        run: |
          git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
  javascript:
    name: JavaScript/TypeScript (when present)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node tests, types and lint
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "No package.json; JS/TS checks not applicable"
            exit 0
          fi
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
            npm audit --audit-level=high
          else
            echo "package-lock.json required for reproducible JS/TS checks"
            exit 1
          fi
          npm run --if-present lint
          npm run --if-present typecheck
          npm test --if-present
  dependencies:
    name: Python dependency audit (when present)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check pip-audit
          if [[ -f requirements.txt ]]; then
            pip-audit -r requirements.txt
          elif [[ -f pyproject.toml ]]; then
            pip-audit .
          else
            echo "No Python dependency manifest"
          fi
